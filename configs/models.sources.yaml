# Human-edited list of approved local models. `make pin-models` turns this into the `models:`
# section of configs/models.yaml, with every file's sha256 and size read from Hugging Face at the
# pinned commit. Only files matching `allow` are pinned; models-fetch never downloads anything else.
#
# Approved 2026-11-19 (milestone 1.0; see docs/plans/phase-1-model-audit.md).
# Models that ship only pickle weights (manga-ocr, CosyVoice2, AudioSeal, LaMa) are added with the
# offline conversion job, not here.

siglip-so400m:
  repo: google/siglip-so400m-patch14-384
  revision: 9fdffc58afc957d1a03a25b10dba0329ab15c2a3
  license: Apache-2.0
  stage: bible (character embeddings)
  allow: [model.safetensors, config.json, preprocessor_config.json]

sam2-1-hiera-small:
  repo: facebook/sam2.1-hiera-small
  revision: ee5bba1d82bb8749febdf90f45e84b687142ba03
  license: Apache-2.0
  stage: render (layer masks)
  allow: [model.safetensors, "*.json"]

depth-anything-v2-small:
  repo: depth-anything/Depth-Anything-V2-Small-hf
  revision: 5426e4f0f36572d16453bbda7a8389317b1bef99
  license: Apache-2.0  # Small only; Base/Large/Giant are CC-BY-NC and must never be added
  stage: render (depth order)
  allow: [model.safetensors, "*.json"]

pp-ocrv5-det:
