  revision: c5041d225cf951ff06900ab81a3c7d543c45e2ad
  license: Apache-2.0
  stage: ingest (text detection)
  allow: [model.safetensors, "*.json", inference.yml]  # repo also has ocr_pipeline.py; never fetched

pp-ocrv5-rec-en:
  repo: PaddlePaddle/en_PP-OCRv5_mobile_rec_safetensors
  revision: e4abce2bbd335f6c3eda0507b7f8e8abd5af3419
  license: Apache-2.0
  stage: ingest (English OCR)
  allow: [model.safetensors, "*.json", inference.yml]

pp-ocrv5-rec-ko:
  repo: PaddlePaddle/korean_PP-OCRv5_mobile_rec_safetensors
  revision: 6ef525a357645ce46495c7ed1fef622c4e009e7a
  license: Apache-2.0
  stage: ingest (Korean OCR)
  allow: [model.safetensors, "*.json", inference.yml]

manga-bubble-detector:
  repo: NorwayFish/manga-bubble-detector
  revision: bcf342f296beb56005e044da15990502629015de
  license: Apache-2.0  # card tag only; training pages undisclosed (open legal item)
  stage: ingest (speech bubbles)
  allow: [model.safetensors, "*.json"]

whisper-large-v3-turbo:
  repo: openai/whisper-large-v3-turbo
  revision: 41f01f3fe87f28c78e2fbf8b568835947dd65ed9
  license: MIT
  stage: validate (speech round-trip)
  allow: [model.safetensors, "*.json", "*.txt"]
