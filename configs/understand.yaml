# Scene understanding (milestone 1.2): local vision model on worker-cpu. Validated by
# pipeline/understand/settings.py. max_attempts * max_time_s must stay under 540 s (the stale
# limit minus a minute), so a slow panel never looks dead.
prompt_version: v3
threads: 4 # the container sees 4 cores; 6 vs 4 measured as a wash (docs: task-4-report)
dtype: bfloat16
max_pixels: 301056 # 384 * 28 * 28: half the image tokens of the old 602112, no visible loss
max_new_tokens: 512
max_attempts: 2 # a cut-off greedy answer repeats: more attempts only burn time
max_time_s: 240 # per generate call; 150 cut off figure-heavy answers when the CPU was busy
max_minutes_per_chapter: 720 # overnight batch: resumable and cached; the trial gate projects the time first
