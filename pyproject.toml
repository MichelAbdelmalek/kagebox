[project]
name = "kagebox"
version = "0.1.0"
description = "Adapt comics, manga and manhwa into hand-drawn-style animated episodes."
requires-python = ">=3.11,<3.12"
license = "LicenseRef-Proprietary"
# Core: shared by every Python image (schemas, provider interface, storage).
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "python-ulid>=3,<4",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<0.155",  # prefect 3.8 server uses Body(min_items=), removed in 0.155
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.18",
  "boto3>=1.35,<2",
  "filetype>=1.2,<2",
  "pillow>=13,<14",
]
worker = [
  # Inference stack (CPU). torch>=2.6: older versions let torch.load(weights_only=True) be bypassed.
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",  # image processors of SAM 2.1 and PP-OCRv5 need it
  "transformers>=5.23,<6",
  "safetensors>=0.5,<1",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "qdrant-client>=1.12,<2",
  "jiwer>=3,<5",
  "soundfile>=0.12,<1",
  "pypdfium2>=4.30,<6",  # PDF rasterization (PDFium; no JS, no network), run in a sandbox
  "prefect>=3.1,<4",
  "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35,<2",
  "filetype>=1.2,<2",
  "pillow>=13,<14",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-pyyaml",
  "bandit>=1.8",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "orchestration", "apps/api/kagebox_api"]

[tool.hatch.build.targets.wheel.sources]
"apps/api" = ""

[tool.uv]
required-version = ">=0.5"

# CPU-only PyTorch builds (PyPI's x86-64 Linux wheels bundle CUDA, several GB). The gpu profile
# image gets its own CUDA lock in Phase 2.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "ASYNC"]
ignore = ["N818"]  # PermissionError subclasses keep domain names (RightsDenied, VoiceLocked)

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "orchestration", "kagebox_api"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/versions/*.py" = ["E501"]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "apps/api"
packages = ["pipeline", "orchestration", "kagebox_api"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "filetype.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "apps/api"]
markers = [
  "live: calls real external services (Together AI); skipped unless KAGEBOX_LIVE_TESTS=1",
  "integration: needs the compose stack (postgres, object store)",
  "models: loads real pinned weights from the models volume; run via make test-models",
]
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not live and not integration and not models'"

[tool.bandit]
exclude_dirs = ["tests", "apps/web", ".venv"]
